# This project uses MongoDB Atlas (a hosted cluster), not a local MongoDB instance --
# there is no MongoDB service here. Point MONGODB_URI (in .env) at your Atlas
# connection string; the application creates its own collections/indexes on first use.
services:
  app:
    build: .
    env_file:
      - .env
    ports:
      - "8000:8000"
    # Runs the MCP server over HTTP -- set MCP_TRANSPORT=streamable-http and
    # MCP_AUTH_TOKEN in .env for this to actually serve requests (see README.md).
    # For a one-shot pipeline run instead, use:
    #   docker compose run --rm app python main.py --mode=demo
